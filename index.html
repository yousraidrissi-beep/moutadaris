
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة المتدارس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-pattern"></div>

<header class="site-header">
  <div class="header-inner">
    <img src="logo.png" alt="شعار مدد" class="logo">
    <div class="header-text">
      <h1>منصة المتدارس</h1>
    </div>
  </div>
  <div class="header-rule"></div>
</header>

<main>
  <section class="intro">
    <p class="eyebrow">بوّابة الأقسام</p>
    <h2>اختر القسم الذي تريد الوصول إليه</h2>
  </section>

  <section class="cards-grid">
    <button class="card" data-key="barnamijMutadaris">
      <span class="card-number">١</span>
      <span class="card-title">البرنامج المتدارس</span>
      <span class="card-arrow">⟵</span>
    </button>

    <button class="card" data-key="tafassirNamudajiya">
      <span class="card-number">٢</span>
      <span class="card-title">التفاسير النموذجية</span>
      <span class="card-arrow">⟵</span>
    </button>

    <button class="card" data-key="taqarir">
      <span class="card-number">٣</span>
      <span class="card-title">التقارير</span>
      <span class="card-arrow">⟵</span>
    </button>

    <button class="card" data-key="barnamijMusahib">
      <span class="card-number">٤</span>
      <span class="card-title">البرنامج المصاحب للتدارس</span>
      <span class="card-arrow">⟵</span>
    </button>

    <button class="card" data-key="fadaIstizada">
      <span class="card-number">٥</span>
      <span class="card-title">فضاء الإستزادة</span>
      <span class="card-arrow">⟵</span>
    </button>

    <button class="card" data-key="anshitaTaahudTaaluf">
      <span class="card-number">٦</span>
      <span class="card-title">أنشطة التعهد و التآلف</span>
      <span class="card-arrow">⟵</span>
    </button>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-ornament">۞</div>
  <p class="quran-verse">
    وَمَنْ أَحْسَنُ قَوْلًا مِمَّنْ دَعَا إِلَى اللَّهِ وَعَمِلَ صَالِحًا وَقَالَ إِنَّنِي مِنَ الْمُسْلِمِينَ
  </p>
  <p class="quran-ref">فصلت: 33</p>
</footer>

<script src="script.js"></script>
</body>
</html>
